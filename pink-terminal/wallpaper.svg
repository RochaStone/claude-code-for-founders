<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1600" viewBox="0 0 2560 1600">
  <title>Welcome to my one woman show</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,800;1,6..96,500&amp;family=Archivo+Narrow:wght@600&amp;family=Permanent+Marker&amp;display=block');
      .didone { font-family: 'Bodoni Moda', Didot, 'Bodoni 72', 'Playfair Display', serif; }
      .tag { font-family: 'Archivo Narrow', 'Arial Narrow', 'Helvetica Neue', sans-serif; font-weight: 600; letter-spacing: 18px; }
      .marker { font-family: 'Permanent Marker', 'Marker Felt', 'Comic Sans MS', cursive; }
    </style>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.07  0 0 0 0 0.07  0 0 0 0 0.07  0 0 0 0.09 0"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#FF4F9C"/>
      <stop offset="1" stop-color="#E81F7A"/>
    </radialGradient>
    <symbol id="sparkle" viewBox="-10 -10 20 20">
      <path d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10 Z" fill="#D4A64A"/>
    </symbol>
  </defs>

  <rect width="2560" height="1600" fill="#FF2D8A"/>
  <rect width="2560" height="1600" fill="url(#glow)" opacity="0.55"/>

  <!-- thin ink rules, like a programme cover -->
  <rect x="120" y="120" width="2320" height="1360" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="140" y="140" width="2280" height="1320" fill="none" stroke="#111111" stroke-width="1"/>

  <text x="1280" y="430" text-anchor="middle" class="tag" font-size="44" fill="#111111">WELCOME TO</text>
  <text x="1280" y="740" text-anchor="middle" class="didone" font-size="300" font-weight="800" fill="#111111" letter-spacing="-4">MY ONE</text>
  <text x="1280" y="1020" text-anchor="middle" class="didone" font-size="250" font-weight="800" fill="#111111" letter-spacing="-3">WOMAN SHOW</text>
  <line x1="880" y1="1110" x2="1680" y2="1110" stroke="#111111" stroke-width="2"/>
  <text x="1280" y="1185" text-anchor="middle" class="didone" font-size="54" font-style="italic" font-weight="500" fill="#111111">where you watch me do whatever I want</text>

  <!-- marker scrawl -->
  <g transform="translate(1330 330) rotate(-6)">
    <text class="marker" font-size="76" fill="#E0202E">build your founder world</text>
    <path d="M-10,30 C240,62 700,54 990,22" stroke="#E0202E" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <use href="#sparkle" x="330" y="330" width="90" height="90"/>
  <use href="#sparkle" x="430" y="440" width="40" height="40"/>
  <use href="#sparkle" x="2150" y="1210" width="110" height="110"/>
  <use href="#sparkle" x="2080" y="1330" width="44" height="44"/>
  <use href="#sparkle" x="560" y="1240" width="56" height="56"/>

  <rect width="2560" height="1600" filter="url(#grain)"/>
</svg>
